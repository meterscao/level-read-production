name: PG-only validation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: PostgreSQL tools
        run: echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: npm install --no-save --package-lock=false pg@8.16.3
      - run: python3 -m unittest
      - run: node scripts/test-pg-primary-local.cjs
